name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The cross-platform claim in the README is only worth what CI proves.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: doctor runs on this platform
        run: node bin/ccl.js doctor
      - name: help runs on this platform
        run: node bin/ccl.js --help
